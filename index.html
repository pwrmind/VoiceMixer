<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voice FX — Vader Minimal</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #121214; color: #e0e0e3; font-family: 'Consolas', monospace; padding: 16px; }
        .mixer-panel { background: linear-gradient(145deg, #1e1e24, #141418); padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 2px solid #282830; text-align: center; width: 100%; max-width: 380px; }
        h1 { font-size: 17px; letter-spacing: 3px; text-transform: uppercase; color: #ff3333;
            margin: 0 0 24px; border-bottom: 1px dashed #3a3a48; padding-bottom: 14px; }
        .knobs-rack { display: flex; justify-content: space-around; gap: 8px; margin-bottom: 28px;
            background: #17171c; padding: 18px 8px 12px; border-radius: 8px; border: 1px solid #22222a; }
        .knob { display: flex; flex-direction: column; align-items: center; cursor: grab;
            user-select: none; touch-action: none; padding: 4px; }
        .knob.active { cursor: grabbing; }
        .knob-body { width: 62px; height: 62px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #55555f, #2a2a32);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.15);
            position: relative; transition: transform 0.04s linear; }
        .knob-indicator { position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            width: 3px; height: 16px; background: #ff3333; border-radius: 2px; }
        .knob.active .knob-body { box-shadow: 0 0 25px rgba(255,51,51,0.55); }
        .knob-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a8a98; margin-top: 8px; }
        .knob-value { font-size: 11px; color: #ff3333; margin-top: 2px; font-weight: bold; min-height: 14px; }
        button { width: 100%; padding: 18px 30px; font-size: 15px; font-weight: bold; font-family: inherit;
            letter-spacing: 1.5px; cursor: pointer; border: 1px solid #ff3333; border-radius: 6px;
            background: #1c1c22; color: #ff3333; user-select: none; outline: none; touch-action: none; }
        button.recording { background: #ff3333; color: #fff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 15px rgba(255,51,51,0.6); }
            50% { box-shadow: 0 0 30px rgba(255,51,51,1.0); } }
        .display-panel { background: #0b0b0d; border: 1px solid #22222a; padding: 12px;
            border-radius: 4px; margin-top: 18px; }
        p { margin: 0; font-size: 12px; color: #00ffcc; letter-spacing: 0.5px; }
        .level-meter { margin-top: 10px; height: 8px; background: #1a1a20; border-radius: 4px; overflow: hidden; }
        .level-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00ffcc, #ffcc00, #ff3333);
            transition: width 0.05s linear; }
    </style>
</head>
<body>
<div class="mixer-panel">
    <h1>Voice FX — Vader</h1>
    <div class="knobs-rack">
        <div class="knob" id="pitchKnob">
            <div class="knob-body"><div class="knob-indicator"></div></div>
            <div class="knob-label">Pitch</div>
            <div class="knob-value" id="pitchValue"></div>
        </div>
        <div class="knob" id="filterKnob">
            <div class="knob-body"><div class="knob-indicator"></div></div>
            <div class="knob-label">Muffler</div>
            <div class="knob-value" id="filterValue"></div>
        </div>
        <div class="knob" id="distKnob">
            <div class="knob-body"><div class="knob-indicator"></div></div>
            <div class="knob-label">Drive</div>
            <div class="knob-value" id="distValue"></div>
        </div>
    </div>
    <button id="recordBtn">HOLD TO RECORD</button>
    <div class="display-panel">
        <p id="status">INITIALIZING...</p>
        <div class="level-meter"><div class="level-fill" id="levelFill"></div></div>
    </div>
</div>

<script>
class Knob {
    constructor(el, opt) {
        this.el = el; this.body = el.querySelector('.knob-body');
        this.valEl = el.querySelector('.knob-value');
        this.min = opt.min; this.max = opt.max;
        this.mapping = opt.mapping || 'linear';
        this.format = opt.format || (v => v.toFixed(2));
        this.onChange = opt.onChange || null;
        this.norm = this._toNorm(opt.value);
        this.drag = false;
        el.addEventListener('pointerdown', e => {
            e.preventDefault(); this.drag = true; this.startY = e.clientY;
            this.startNorm = this.norm; el.setPointerCapture(e.pointerId);
            el.classList.add('active');
        });
        el.addEventListener('pointermove', e => {
            if (!this.drag) return;
            const dy = this.startY - e.clientY;
            this.norm = Math.max(0, Math.min(1, this.startNorm + dy / 200));
            this._render(); if (this.onChange) this.onChange(this.value);
        });
        el.addEventListener('pointerup', e => {
            this.drag = false; el.classList.remove('active');
            if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
        });
        this._render(); if (this.onChange) this.onChange(this.value);
    }
    _toNorm(v) { return this.mapping === 'log'
        ? Math.log(v / this.min) / Math.log(this.max / this.min)
        : (v - this.min) / (this.max - this.min); }
    _fromNorm(n) { n = Math.max(0, Math.min(1, n)); return this.mapping === 'log'
        ? this.min * Math.pow(this.max / this.min, n)
        : this.min + n * (this.max - this.min); }
    get value() { return this._fromNorm(this.norm); }
    _render() {
        this.body.style.transform = `rotate(${-135 + this.norm * 270}deg)`;
        this.valEl.textContent = this.format(this.value);
    }
}

let audioContext = null, mediaStream = null;
let isRecording = false, recordedChunks = [];
let recSource = null, recProcessor = null, recMute = null;
let pbSource = null, pbFilter = null, pbPre = null, pbShaper = null, pbPost = null, pbComp = null;

let currentRate = 0.8, currentFreq = 3000, currentDrive = 1.5;

const recordBtn = document.getElementById('recordBtn');
const statusText = document.getElementById('status');
const levelFill = document.getElementById('levelFill');

async function ensureContext() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') await audioContext.resume();
}
async function ensureStream() {
    if (mediaStream && mediaStream.getAudioTracks().every(t => t.readyState === 'live')) return mediaStream;
    mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 }
    });
    return mediaStream;
}

async function startRecording() {
    try { await ensureContext(); await ensureStream(); }
    catch (e) { statusText.innerText = 'MIC ERROR'; return; }

    stopPlayback();
    recordedChunks = []; isRecording = true;

    recSource = audioContext.createMediaStreamSource(mediaStream);
    recProcessor = audioContext.createScriptProcessor(4096, 1, 1);
    recMute = audioContext.createGain(); recMute.gain.value = 0;

    recProcessor.onaudioprocess = e => {
        if (!isRecording) return;
        const d = e.inputBuffer.getChannelData(0);
        let peak = 0;
        for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
        levelFill.style.width = Math.min(100, peak * 250) + '%';
        recordedChunks.push(new Float32Array(d));
    };

    recSource.connect(recProcessor); recProcessor.connect(recMute);
    recMute.connect(audioContext.destination);
    recordBtn.classList.add('recording');
    statusText.innerText = 'RECORDING...';
}
function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    if (recSource) { recSource.disconnect(); recSource = null; }
    if (recProcessor) { recProcessor.onaudioprocess = null; recProcessor.disconnect(); recProcessor = null; }
    if (recMute) { recMute.disconnect(); recMute = null; }
    recordBtn.classList.remove('recording');
    levelFill.style.width = '0%';
    if (!recordedChunks.length) { statusText.innerText = 'NO AUDIO'; return; }
    playRecorded();
}

function tanhCurve(amount) {
    const n = 4096, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i * 2) / n - 1; c[i] = Math.tanh(x * amount); }
    return c;
}
const SHAPER = tanhCurve(3);

function normalize(samples, target = 0.9) {
    let peak = 0;
    for (let i = 0; i < samples.length; i++) { const a = Math.abs(samples[i]); if (a > peak) peak = a; }
    if (peak < 1e-6) return;
    const g = target / peak;
    for (let i = 0; i < samples.length; i++) samples[i] *= g;
    console.log('[normalize] peak', peak.toFixed(4), 'gain', g.toFixed(2));
}

function playRecorded() {
    const total = recordedChunks.reduce((s, c) => s + c.length, 0);
    const samples = new Float32Array(total);
    let off = 0;
    for (const c of recordedChunks) { samples.set(c, off); off += c.length; }
    normalize(samples, 0.9);

    const buf = audioContext.createBuffer(1, samples.length, audioContext.sampleRate);
    buf.copyToChannel(samples, 0);

    // Цепочка: source → lowpass → preGain → shaper → postGain → compressor → out
    pbSource = audioContext.createBufferSource();
    pbSource.buffer = buf;
    pbSource.playbackRate.value = currentRate;

    pbFilter = audioContext.createBiquadFilter();
    pbFilter.type = 'lowpass';
    pbFilter.frequency.value = currentFreq;
    pbFilter.Q.value = 0.7;

    pbPre = audioContext.createGain();
    pbPre.gain.value = currentDrive / 3;

    pbShaper = audioContext.createWaveShaper();
    pbShaper.curve = SHAPER;
    pbShaper.oversample = '4x';

    pbPost = audioContext.createGain();
    pbPost.gain.value = 1.6;

    pbComp = audioContext.createDynamicsCompressor();
    pbComp.threshold.value = -18; pbComp.knee.value = 24;
    pbComp.ratio.value = 4; pbComp.attack.value = 0.003; pbComp.release.value = 0.25;

    pbSource.connect(pbFilter); pbFilter.connect(pbPre);
    pbPre.connect(pbShaper); pbShaper.connect(pbPost);
    pbPost.connect(pbComp); pbComp.connect(audioContext.destination);

    const s = pbSource;
    pbSource.onended = () => {
        if (pbSource === s) { statusText.innerText = 'SYSTEM READY'; cleanup(); }
    };
    pbSource.start();
    statusText.innerText = 'PLAYING — крутите ручки!';
}
function cleanup() {
    [pbSource, pbFilter, pbPre, pbShaper, pbPost, pbComp].forEach(n => { if (n) { n.disconnect(); } });
    pbSource = pbFilter = pbPre = pbShaper = pbPost = pbComp = null;
}
function stopPlayback() {
    if (pbSource) { pbSource.onended = null; try { pbSource.stop(); } catch(_){} }
    cleanup();
}

new Knob(document.getElementById('pitchKnob'), {
    min: 0.5, max: 1.5, value: 0.8, mapping: 'linear',
    format: v => v.toFixed(2) + '×',
    onChange: v => { currentRate = v;
        if (pbSource) pbSource.playbackRate.setTargetAtTime(v, audioContext.currentTime, 0.02); }
});
new Knob(document.getElementById('filterKnob'), {
    min: 500, max: 8000, value: 3000, mapping: 'log',
    format: v => Math.round(v) + ' Hz',
    onChange: v => { currentFreq = v;
        if (pbFilter) pbFilter.frequency.setTargetAtTime(v, audioContext.currentTime, 0.02); }
});
new Knob(document.getElementById('distKnob'), {
    min: 0.1, max: 5, value: 1.5, mapping: 'linear',
    format: v => v.toFixed(1),
    onChange: v => { currentDrive = v;
        if (pbPre) pbPre.gain.setTargetAtTime(v / 3, audioContext.currentTime, 0.02); }
});

recordBtn.addEventListener('pointerdown', async e => {
    e.preventDefault(); recordBtn.setPointerCapture(e.pointerId); await startRecording();
});
recordBtn.addEventListener('pointerup', e => {
    stopRecording();
    if (recordBtn.hasPointerCapture(e.pointerId)) recordBtn.releasePointerCapture(e.pointerId);
});
recordBtn.addEventListener('pointercancel', e => {
    stopRecording();
    if (recordBtn.hasPointerCapture(e.pointerId)) recordBtn.releasePointerCapture(e.pointerId);
});
</script>
</body>
</html>
